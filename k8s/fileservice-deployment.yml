apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileservice
  namespace: mvp-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fileservice
  template:
    metadata:
      labels:
        app: fileservice
    spec:
      containers:
        - name: fileservice
          image: fileservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
