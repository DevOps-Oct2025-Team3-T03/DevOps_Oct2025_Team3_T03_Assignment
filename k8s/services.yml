apiVersion: v1
kind: Namespace
metadata:
  name: mvp-staging
---
apiVersion: v1
kind: Service
metadata:
  name: authservice-svc
  namespace: mvp-staging
spec:
  type: NodePort
  selector:
    app: authservice
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: fileservice-svc
  namespace: mvp-staging
spec:
  type: NodePort
  selector:
    app: fileservice
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001