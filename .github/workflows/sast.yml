# SAST (Static Application Security Testing) with CodeQL
name: 1. SAST - Code Security Scan

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

jobs:
  analyze:
    name: CodeQL Code Scan (SAST)
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      
      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      # Step 5: Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast

      # Notification: SAST SUCCESS
      - name: Notify QA Channel - SAST Passed
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: LOW
          title: SAST Security Scan Completed - No Critical Issues
          message: |
            CodeQL SAST analysis completed successfully!
            No critical or high-severity vulnerabilities detected.
            Review full scan results in GitHub Security tab.
          workflow_name: SAST - Code Security Scan
          repo: ${{ github.repository }}
          status: success
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}

      # Notification: SAST FAILURE (Issues Found)
      - name: Notify QA Channel - SAST Issues Detected
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: HIGH
          title: SAST Security Issues Detected
          message: |
            CodeQL SAST analysis found potential security vulnerabilities!
            Action Required: Review security findings in GitHub Security tab
            Check code for: SQL Injection, XSS, Insecure Deserialization, etc.
          workflow_name: SAST - Code Security Scan
          repo: ${{ github.repository }}
          status: failure
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}
