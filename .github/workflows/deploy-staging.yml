name: CD - Deploy to Staging

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: self-hosted

    # Manual approval gate
    environment:
      name: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from commit 
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v0.0.0-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
           python-version: "3.11"

      # Test authService
      - name: Test authService
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/authService/requirements.txt
          pytest backend/authService/tests -v

      # Test fileService
      - name: Test fileService
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fileService/requirements.txt
          pytest backend/fileService/tests -v

      # Build Docker images
      # -f is for file, it specifies to Docker to only look at the specified file, backend/authService/Dockerfile for example
      - name: Build authService image
        run: docker build -f backend/authService/Dockerfile -t authservice:${{ steps.version.outputs.version }} .

      - name: Build fileService image
        run: docker build -f backend/fileService/Dockerfile -t fileservice:${{ steps.version.outputs.version }} .

      # Deploy to Staging
      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ steps.version.outputs.version }}"
          docker run -d -p 5000:5000 authservice:${{ steps.version.outputs.version }}
          docker run -d -p 5001:5001 fileservice:${{ steps.version.outputs.version }}

       # Telegram notification — SUCCESS
      - name: Telegram Notify (Success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text=" STAGING DEPLOY SUCCESS\nRepo: ${{ github.repository }}\nVersion: ${{ steps.version.outputs.version }}"

       # Telegram notification — FAILURE
      - name: Telegram Notify (Failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text=" STAGING DEPLOY FAILED\nRepo: ${{ github.repository }}"
        
      # Notification: DEPLOYMENT SUCCESS to DevOps Channel
      - name: Notify DevOps Channel - Deployment Success
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: DEPLOYMENT
          severity: LOW
          title: Staging Deployment Successful
          message: |
            Staging deployment completed successfully!
            Version: ${{ steps.version.outputs.version }}
            Services running:
            - authService on port 5000
            - fileService on port 5001
            All systems operational.
          workflow_name: Deploy to Staging
          repo: ${{ github.repository }}
          status: success
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}

      # Notification: DEPLOYMENT FAILURE to DevOps Channel
      - name: Notify DevOps Channel - Deployment Failed
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: DEPLOYMENT
          severity: HIGH
          title: Staging Deployment Failed
          message: |
            Staging deployment failed!
            Version: ${{ steps.version.outputs.version }}
            Investigation required:
            - Check test results (authService and fileService)
            - Verify Docker image builds
            - Review deployment logs for errors
          workflow_name: Deploy to Staging
          repo: ${{ github.repository }}
          status: failure
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}