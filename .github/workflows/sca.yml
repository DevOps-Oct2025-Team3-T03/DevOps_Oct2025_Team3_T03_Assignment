# SCA (Software Composition Analysis) with OWASP Dependency-Check
name: 2. SCA - Dependency Security Scan

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  security-events: write

jobs:
  sca:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Run OWASP Dependency-Check
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'calculator-app'
          path: '.'
          format: 'ALL'  # Generate HTML, JSON, CSV, XML
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired
      
      # Step 5: Upload Dependency-Check reports
      # ✅ Proper artifact naming (hyphens, not underscores)
      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: reports/
      
      # Step 6: Upload to GitHub Security (if SARIF available)
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: sca

      # Notification: SCA SUCCESS
      - name: Notify QA Channel - SCA Passed
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: LOW
          title: SCA Dependency Scan Passed
          message: |
            OWASP Dependency-Check completed successfully!
            All dependencies are below CVSS 7.0 threshold.
            Reports available in GitHub artifacts.
          workflow_name: SCA - Dependency Security Scan
          repo: ${{ github.repository }}
          status: success
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}

      # Notification: SCA FAILURE (Vulnerable Dependencies Found)
      - name: Notify QA Channel - Vulnerable Dependencies Detected
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: CRITICAL
          title: Vulnerable Dependencies Detected (CVSS >= 7.0)
          message: |
            CRITICAL: High-risk vulnerabilities found in dependencies!
            Action Required: Review dependency-check reports immediately
            Update vulnerable packages to patched versions
            Review scan results in GitHub artifacts/security tab
          workflow_name: SCA - Dependency Security Scan
          repo: ${{ github.repository }}
          status: failure
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}
