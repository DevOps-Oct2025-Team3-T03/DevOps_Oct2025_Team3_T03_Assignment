# Automated workflow to create a PR from develop to main upon release publication
name: Create PR & Merge to Main

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Create PR to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Create PR (develop → main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "Release approved: merge develop into main" \
            --body "Automated PR created from a published release."