name: Create PR & Merge to Main

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Create PR to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Create PR (develop → main)
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: release/merge-develop-to-main
          title: "Release approved: merge develop into main"
          body: |
            Automated PR created from a published release.
            Source: develop
            Target: main