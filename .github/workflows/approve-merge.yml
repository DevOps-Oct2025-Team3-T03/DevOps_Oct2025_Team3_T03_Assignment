# Automated workflow to create a PR from develop to main upon release publication
name: Create PR & Merge to Main

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Create PR to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Create or Update PR (develop → main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base main --head develop --json number --jq '.[0].number')
          
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists. Updating description."
            gh pr edit "$EXISTING_PR" \
              --title "Release approved: merge develop into main" \
              --body "Automated PR updated from a published release."
            echo "Existing PR updated successfully"
          else
            echo "No existing PR found. Creating new PR."
            gh pr create \
              --base main \
              --head develop \
              --title "Release approved: merge develop into main" \
              --body "Automated PR created from a published release."
            echo "New PR created successfully"
          fi