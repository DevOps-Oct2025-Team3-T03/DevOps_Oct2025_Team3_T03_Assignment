# DAST (Dynamic Application Security Testing) with OWASP ZAP
name: 3. DAST - Live Application Scan

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  security-events: write
  issues: write # For ZAP to create issues

jobs:
  dast:
    name: OWASP ZAP Scan (DAST)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies - Auth Service
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/authService/requirements.txt

      - name: Install dependencies - File Service
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fileService/requirements.txt

      # Step 4: Start the application in background (Auth Service)
      - name: Start Flask application (Auth Service)
        working-directory: backend/authService
        env:
          PYTHONPATH: ../
        run: |
          python app.py &
          sleep 10  # Wait for app to start
          echo " Application started on http://localhost:5000"

      # Step 5: Verify application is running (Auth Service)
      - name: Verify application is running
        run: |
          curl -f http://localhost:5000/health || exit 1
          echo "Application is responding"

      # Step 6: Run OWASP ZAP Baseline Scan
      # CORRECT VERSION: v0.14.0 (not v0.15.0)
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000/health"
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: "zap-baseline-scan" # Override artifact name!
        continue-on-error: true

      #  Manual artifact upload with proper naming
      - name: Upload ZAP baseline reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # Step 7: Run OWASP ZAP Full Scan (more thorough)
      # CORRECT VERSION: v0.12.0 (not v0.15.0)
      - name: ZAP Full Scan - Auth Service
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://localhost:5000/health"
          cmd_options: "-a -j"
          allow_issue_writing: false
          artifact_name: "zap-fullscan-scan" # Override artifact name!
        continue-on-error: true

      #  Unique artifact name for full scan results
      - name: Upload ZAP fullscan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-fullscan-auth-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # Step 8: Start File Service
      - name: Start File Service
        working-directory: backend/fileService
        env:
          PYTHONPATH: ../
        run: |
          python app.py &
          sleep 10

      # Step 9: Verify File Service is running
      - name: Verify File Service
        run: |
          curl -f http://localhost:5001/health || exit 1
          echo "File Service responding"

      # Step 10: ZAP Baseline Scan - File Service
      - name: ZAP Baseline Scan - File Service
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5001/health"
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: "zap-baseline-file"
        continue-on-error: true

      - name: Upload File Service ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-file-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # Step 11: ZAP Full Scan - File Service
      - name: ZAP Full Scan - File Service
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://localhost:5001/health"
          cmd_options: "-a -j"
          allow_issue_writing: false
          artifact_name: "zap-fullscan-scan" # Override artifact name!
        continue-on-error: true

      #  Unique artifact name for full scan results
      - name: Upload ZAP fullscan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-fullscan-file-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # Notification: DAST SUCCESS
      - name: Notify QA Channel - DAST Passed
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: LOW
          title: DAST Dynamic Security Scan Completed
          message: |
            OWASP ZAP dynamic scanning completed successfully!
            Services scanned:
            - authService (port 5000)
            - fileService (port 5001)
            No critical vulnerabilities detected.
            Review detailed reports in GitHub artifacts.
          workflow_name: DAST - Live Application Scan
          repo: ${{ github.repository }}
          status: success

      # Notification: DAST FAILURE (Vulnerabilities Found)
      - name: Notify QA Channel - DAST Issues Detected
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: SECURITY
          severity: HIGH
          title: DAST Security Issues Detected
          message: |
            OWASP ZAP found potential security vulnerabilities in running application!
            Action Required: Review vulnerability reports immediately
            Potential issues: XSS, CSRF, Authentication flaws, SQL Injection risks
            Download detailed ZAP reports from GitHub artifacts and review with QA team
          workflow_name: DAST - Live Application Scan
          repo: ${{ github.repository }}
          status: failure

