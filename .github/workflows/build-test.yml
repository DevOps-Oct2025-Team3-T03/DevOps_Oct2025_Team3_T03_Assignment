name: CI - AuthService + FileService

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# Allow creating releases with GitHub Actions
permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.version.outputs.rc_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (authService)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/authService/requirements.txt

      - name: Run tests (authService)
        run: |
          pytest backend/authService/tests -v

      - name: Install dependencies (fileService)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fileService/requirements.txt

      - name: Run tests (fileService)
        run: |
          pytest backend/fileService/tests -v

      - name: Generate RC Version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RC_VERSION="v0.0.0-rc.${TIMESTAMP}.${SHORT_SHA}"
          echo "rc_version=${RC_VERSION}" >> $GITHUB_OUTPUT
          echo "RC Version: ${RC_VERSION}"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
           name: test-report-${{ steps.version.outputs.rc_version }}
           path: htmlcov/
           retention-days: 7

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.rc_version }}
          draft: true
          body: |
            # Release Candidate
            **Version:** ${{ steps.version.outputs.rc_version }}
            **Status:** Waiting for team approval
            **To Approve:** Edit → Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Notification: Build & Test SUCCESS
      - name: Notify Dev Channel - Build Success
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: BUILD
          severity: LOW
          title: Build & Tests Passed
          message: |
            All tests passed successfully!
            RC Version: ${{ steps.version.outputs.rc_version }}
            Ready for QA security scanning
          workflow_name: CI - AuthService + FileService
          repo: ${{ github.repository }}
          status: success
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}

      # Notification: Build & Test FAILURE
      - name: Notify Dev Channel - Build Failed
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: BUILD
          severity: HIGH
          title: Build or Tests Failed
          message: |
            Build/Test pipeline failed!
            Check the logs and fix the breaking changes.
            Workflow: ${{ github.workflow }}
          workflow_name: CI - AuthService + FileService
          repo: ${{ github.repository }}
          status: failure
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}