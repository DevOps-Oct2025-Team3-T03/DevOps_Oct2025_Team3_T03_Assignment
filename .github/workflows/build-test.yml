name: CI - AuthService + FileService

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (authService)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/authService/requirements.txt

      - name: Run tests (authService)
        run: |
          pytest backend/authService/tests -v

      - name: Install dependencies (fileService)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/fileService/requirements.txt

      - name: Run tests (fileService)
        run: |
          pytest backend/fileService/tests -v

      # Notification: Build & Test SUCCESS
      - name: Notify Dev Channel - Build Success
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: BUILD
          severity: LOW
          title: Build & Tests Passed
          message: |
            All tests passed successfully!
            Ready for QA security scanning
          workflow_name: CI - AuthService + FileService
          repo: ${{ github.repository }}
          status: success
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}

      # Notification: Build & Test FAILURE
      - name: Notify Dev Channel - Build Failed
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          alert_type: BUILD
          severity: HIGH
          title: Build or Tests Failed
          message: |
            Build/Test pipeline failed!
            Check the logs and fix the breaking changes.
            Workflow: ${{ github.workflow }}
          workflow_name: CI - AuthService + FileService
          repo: ${{ github.repository }}
          status: failure
          slack_qa_webhook: ${{ secrets.SLACK_QA_WEBHOOK }}
          slack_dev_webhook: ${{ secrets.SLACK_DEV_WEBHOOK }}
          slack_devops_webhook: ${{ secrets.SLACK_DEVOPS_WEBHOOK }}